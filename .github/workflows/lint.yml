name: lint

# Replaces the Woodpecker pipeline that ran on Codeberg CI. That repository is archived
# (its README redirects here), so the old pipeline ran nowhere and was removed in 3.1.0 —
# this is the same check, on the host the project actually lives on now.
#
# Structural lint, then the spec check. The behavioural suite (./scripts/smoke.sh) has sixteen
# checks that need a logged-in `claude` CLI and real model calls; those stay a pre-release step
# run by hand. The rest of it runs here, in the second job, with --no-model.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # The full history: release-check.sh counts commits between a report and its shipping commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Run lint
        run: python3 scripts/lint.py
      # Every spec under .shipkit/specs/: each requirement has a task, each requirement of a
      # shipped spec has a cited test or an [untested: reason], and open specs' tasks are
      # well formed. POSIX sh + awk + git; no model calls.
      # Proves spec-contract/REQ-23: this repository passes its own check.
      - name: Check specs
        run: sh plugins/shipkit/scripts/spec-check.sh .
      # Each shipped spec's newest READY report against the commit that shipped it. Observe mode:
      # it prints NO-REPORT, ORPHAN-REPORT and CHANGED-AFTER-GATE lines and exits 0; --enforce
      # waits until two releases have read it clean (gate-as-software/design.md, fourth record).
      # Proves gate-as-software/REQ-31.
      - name: Release check (observe mode)
        run: sh plugins/shipkit/scripts/release-check.sh .
      # The last tagged release's spec-check.sh on this tree, beside the branch's own above: a pull
      # request cannot pass by weakening the script that checks it (decision 0007). Both must
      # exit 0. Proves gate-as-software/REQ-36.
      - name: Check specs with the last tag's spec-check
        run: |
          tag=$(git describe --tags --abbrev=0)
          echo "judge: $tag"
          git show "$tag:plugins/shipkit/scripts/spec-check.sh" > "$RUNNER_TEMP/spec-check-tag.sh"
          sh "$RUNNER_TEMP/spec-check-tag.sh" .

  # The smoke suite without its sixteen model checks. This runner has no `claude`, so every pull
  # request shows again that --no-model starts none. Proves honest-evidence/REQ-11.
  # macOS on purpose: the suite was written against bash 3.2 as `sh` and BSD tools
  # (.shipkit/specs/honest-evidence/design.md, third record). The full history is fetched
  # because some checks read this repository's tags, and git is given a name because some
  # checks commit in scratch repositories. Check 30's one-second limit on the briefing holds
  # here too: SMOKE_TIMING is not set (numbers-as-data/REQ-18).
  smoke-no-model:
    runs-on: macos-latest
    env:
      GIT_AUTHOR_NAME: smoke
      GIT_AUTHOR_EMAIL: smoke@example.invalid
      GIT_COMMITTER_NAME: smoke
      GIT_COMMITTER_EMAIL: smoke@example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Smoke suite, without the checks that start a model
        run: sh scripts/smoke.sh --no-model </dev/null
